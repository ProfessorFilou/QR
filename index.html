<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>QRForge</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

<style>
:root{
  --bg:#07090d;
  --panel:rgba(255,255,255,.055);
  --panel2:rgba(255,255,255,.085);
  --border:rgba(255,255,255,.10);
  --text:#f7f8fa;
  --muted:#9299a6;
  --accent:#7182ff;
  --good:#4ade80;
  --warn:#fbbf24;
  --bad:#fb7185;
  --radius:24px;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(
      circle at 15% 0%,
      rgba(113,130,255,.16),
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 10%,
      rgba(0,190,255,.08),
      transparent 28%
    ),
    var(--bg);
  color:var(--text);
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  color:inherit;
  border:0;
  cursor:pointer;
}

.app{
  width:min(1450px,100%);
  margin:auto;
  padding:22px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brandmark{
  width:44px;
  height:44px;
  border-radius:14px;

  display:grid;
  place-items:center;

  color:#090a0e;
  font-weight:950;

  background:
    linear-gradient(
      135deg,
      #fff,
      #8795ff
    );

  box-shadow:
    0 12px 35px rgba(113,130,255,.28);
}

.brand h1{
  margin:0;
  font-size:20px;
  letter-spacing:-.04em;
}

.brand span{
  color:var(--muted);
  font-size:12px;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.lang,
.account-button{
  min-height:42px;
  padding:0 13px;

  display:flex;
  align-items:center;
  gap:8px;

  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;

  backdrop-filter:blur(20px);
}

.account-button{
  display:none;
}

.account-button.visible{
  display:flex;
}

.layout{
  display:grid;
  grid-template-columns:minmax(310px,430px) minmax(400px,1fr);
  gap:20px;
}

.panel{
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.065),
      rgba(255,255,255,.025)
    );

  border:1px solid var(--border);
  border-radius:var(--radius);

  box-shadow:
    0 25px 80px rgba(0,0,0,.28);

  backdrop-filter:blur(25px);
}

.controls{
  padding:20px;
}

.section{
  margin-bottom:22px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.section-title strong{
  font-size:13px;
}

.section-title small{
  color:var(--muted);
}

label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:7px;
}

input[type=text],
input[type=email],
input[type=password],
input[type=url],
textarea,
select{
  width:100%;

  padding:12px 13px;

  border:1px solid var(--border);
  border-radius:13px;

  outline:none;

  background:rgba(0,0,0,.2);
  color:var(--text);

  transition:.2s;
}

input:focus,
textarea:focus,
select:focus{
  border-color:rgba(113,130,255,.7);
  box-shadow:
    0 0 0 3px rgba(113,130,255,.1);
}

textarea{
  min-height:100px;
  resize:vertical;
}

.segment{
  display:grid;
  gap:4px;
  padding:4px;

  background:rgba(0,0,0,.18);
  border:1px solid var(--border);
  border-radius:13px;
}

.segment button{
  padding:9px 5px;

  border-radius:9px;

  background:transparent;
  color:var(--muted);

  font-size:12px;
}

.segment button.active{
  background:rgba(255,255,255,.11);
  color:#fff;
}

#typeTabs{
  grid-template-columns:repeat(4,1fr);
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.color-row{
  display:grid;
  grid-template-columns:52px 1fr;
  gap:8px;
}

input[type=color]{
  width:52px;
  height:43px;
  padding:4px;

  background:transparent;
  border:1px solid var(--border);
  border-radius:12px;
}

.range{
  width:100%;
  accent-color:var(--accent);
}

.inline{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.check{
  display:flex;
  align-items:center;
  gap:9px;

  color:#cbd0da;
  font-size:13px;
}

.check input{
  accent-color:var(--accent);
}

.switch{
  position:relative;
  width:42px;
  height:24px;
}

.switch input{
  display:none;
}

.slider{
  position:absolute;
  inset:0;

  border-radius:20px;
  background:#292d35;

  cursor:pointer;
}

.slider:before{
  content:"";

  position:absolute;

  width:18px;
  height:18px;

  top:3px;
  left:3px;

  background:#fff;
  border-radius:50%;

  transition:.2s;
}

.switch input:checked+.slider{
  background:var(--accent);
}

.switch input:checked+.slider:before{
  transform:translateX(18px);
}

.logo-drop{
  padding:18px;

  text-align:center;

  border:1px dashed rgba(255,255,255,.2);
  border-radius:16px;

  background:rgba(255,255,255,.025);

  transition:.2s;
}

.logo-drop.drag{
  border-color:var(--accent);
  background:rgba(113,130,255,.08);
}

.logo-drop button{
  margin-top:8px;

  padding:9px 14px;

  background:rgba(255,255,255,.09);
  border-radius:10px;
}

#logoFile{
  display:none;
}

.logo-preview{
  display:none;

  align-items:center;

  margin-top:10px;
  padding:10px;

  border:1px solid var(--border);
  border-radius:13px;
}

.logo-preview img{
  width:45px;
  height:45px;

  object-fit:contain;

  border-radius:10px;
  background:#fff;
}

.logo-name{
  flex:1;
  padding:0 10px;

  font-size:12px;
}

.remove-logo{
  padding:8px 10px;

  color:#ff8c8c;
  background:rgba(255,100,100,.12);
  border-radius:9px;
}

.primary{
  width:100%;
  padding:14px;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #8997ff,
      #6174ff
    );

  color:#fff;
  font-weight:750;

  box-shadow:
    0 12px 35px rgba(97,116,255,.22);

  transition:.2s;
}

.primary:hover{
  transform:translateY(-1px);
  filter:brightness(1.07);
}

.secondary{
  padding:11px 13px;

  background:rgba(255,255,255,.075);

  border:1px solid var(--border);
  border-radius:12px;
}

.preview{
  min-height:720px;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}

.tabs{
  display:flex;
  gap:7px;

  padding:7px;

  border-bottom:1px solid var(--border);
}

.tab{
  flex:1;

  padding:11px;

  background:transparent;
  color:var(--muted);

  border-radius:13px;
}

.tab.active{
  background:rgba(255,255,255,.09);
  color:#fff;
}

.qr-area{
  flex:1;

  display:grid;
  place-items:center;

  padding:35px;

  position:relative;
  overflow:hidden;
}

.qr-stage{
  width:min(520px,90%);
  aspect-ratio:1;

  display:grid;
  place-items:center;

  position:relative;
}

#qrCanvas{
  width:100%;
  height:100%;
  max-width:520px;
  max-height:520px;

  background:#fff;

  border-radius:4px;

  box-shadow:
    0 30px 80px rgba(0,0,0,.45);
}

.empty{
  position:absolute;
  inset:0;

  display:grid;
  place-items:center;

  text-align:center;

  color:var(--muted);

  pointer-events:none;
}

.empty-inner{
  max-width:300px;
}

.empty-icon{
  width:75px;
  height:75px;

  margin:auto auto 15px;

  display:grid;
  place-items:center;

  border:1px solid var(--border);
  border-radius:22px;

  font-size:25px;
}

.preview-bottom{
  display:grid;
  grid-template-columns:1fr auto;
  gap:15px;
  align-items:center;

  padding:15px 18px;

  border-top:1px solid var(--border);
}

.health{
  display:flex;
  align-items:center;
  gap:10px;
}

.health-bar{
  width:130px;
  height:7px;

  overflow:hidden;

  background:rgba(255,255,255,.08);

  border-radius:99px;
}

.health-fill{
  width:0;
  height:100%;

  background:var(--good);

  transition:.4s;
}

.export-row{
  display:flex;
  gap:8px;
}

.hidden{
  display:none!important;
}

.fade-in{
  animation:fade .35s ease both;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(7px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

.morph{
  animation:
    qrMorph .65s cubic-bezier(.2,.8,.2,1);
}

@keyframes qrMorph{
  0%{
    opacity:.2;
    transform:scale(.93) rotate(-1deg);
    filter:blur(8px);
  }

  45%{
    opacity:1;
    transform:scale(1.015) rotate(.3deg);
    filter:blur(0);
  }

  100%{
    transform:scale(1);
  }
}

.health-card{
  padding:14px;

  background:rgba(255,255,255,.025);

  border:1px solid var(--border);
  border-radius:15px;
}

.health-list{
  display:grid;
  gap:8px;
}

.health-item{
  display:flex;
  justify-content:space-between;
  gap:12px;

  font-size:12px;
  color:var(--muted);
}

.good{
  color:var(--good);
}

.warn{
  color:var(--warn);
}

.bad{
  color:var(--bad);
}

/* ACCOUNT MODAL */

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:1000;

  display:none;
  place-items:center;

  padding:20px;

  background:rgba(0,0,0,.65);

  backdrop-filter:blur(15px);
}

.modal-backdrop.open{
  display:grid;
}

.modal{
  width:min(430px,100%);

  padding:22px;

  background:
    linear-gradient(
      145deg,
      rgba(25,28,36,.98),
      rgba(12,14,19,.98)
    );

  border:1px solid var(--border);
  border-radius:24px;

  box-shadow:
    0 40px 120px rgba(0,0,0,.6);
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:18px;
}

.modal-header h2{
  margin:0;
  font-size:19px;
}

.close{
  width:34px;
  height:34px;

  border-radius:10px;

  background:rgba(255,255,255,.07);
}

.auth-google{
  width:100%;
  padding:12px;

  background:#fff;
  color:#111;

  border-radius:12px;

  font-weight:650;
}

.auth-divider{
  display:flex;
  align-items:center;
  gap:10px;

  margin:16px 0;

  color:var(--muted);
  font-size:11px;
}

.auth-divider:before,
.auth-divider:after{
  content:"";
  height:1px;
  flex:1;
  background:var(--border);
}

.auth-actions{
  display:grid;
  gap:8px;
  margin-top:12px;
}

.auth-message{
  min-height:18px;
  margin-top:10px;

  color:var(--bad);

  font-size:12px;
}

.account-info{
  padding:13px;

  margin-bottom:14px;

  background:rgba(255,255,255,.04);

  border:1px solid var(--border);
  border-radius:14px;
}

.account-email{
  font-size:13px;
  word-break:break-all;
}

.account-provider{
  margin-top:4px;

  color:var(--muted);
  font-size:11px;
}

.danger{
  color:#ff8999!important;
  background:rgba(255,90,110,.08)!important;
  border-color:rgba(255,90,110,.15)!important;
}

@media(max-width:900px){

  .layout{
    grid-template-columns:1fr;
  }

  .preview{
    min-height:600px;
  }

}

@media(max-width:550px){

  .app{
    padding:12px;
  }

  .controls{
    padding:15px;
  }

  .qr-area{
    padding:18px;
  }

  .preview-bottom{
    grid-template-columns:1fr;
  }

  .export-row{
    width:100%;
  }

  .export-row button{
    flex:1;
  }

  .stats{
    display:none;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">

  <div class="brand">

    <div class="brandmark">
      QR
    </div>

    <div>
      <h1>QRForge</h1>
      <span data-i18n="subtitle">
        Professional QR Studio
      </span>
    </div>

  </div>

  <div class="top-actions">

    <button
      class="lang"
      id="langBtn">
      🇩🇪 <span>Deutsch</span>
    </button>

    <button
      class="account-button"
      id="accountButton">
      <span id="accountIcon">○</span>
      <span data-i18n="account">Account</span>
    </button>

  </div>

</header>


<main class="layout">

<!-- =====================================================
     CONTROLS
===================================================== -->

<section class="panel controls">

  <!-- CONTENT -->

  <div class="section">

    <div class="section-title">
      <strong data-i18n="content">
        Inhalt
      </strong>
    </div>

    <div class="segment" id="typeTabs">

      <button
        class="active"
        data-type="url"
        data-i18n="url">
        URL
      </button>

      <button
        data-type="text"
        data-i18n="text">
        Text
      </button>

      <button
        data-type="wifi"
        data-i18n="wifi">
        Wi-Fi
      </button>

      <button
        data-type="email"
        data-i18n="email">
        E-Mail
      </button>

    </div>

  </div>


  <div
    id="contentArea"
    class="section fade-in">
  </div>


  <!-- DESIGN -->

  <div class="section">

    <div class="section-title">
      <strong data-i18n="design">
        Design
      </strong>
    </div>


    <div class="grid2">

      <div>

        <label data-i18n="foreground">
          Vordergrund
        </label>

        <div class="color-row">

          <input
            id="fgColor"
            type="color"
            value="#111111">

          <input
            id="fgText"
            type="text"
            value="#111111">

        </div>

      </div>


      <div>

        <label data-i18n="background">
          Hintergrund
        </label>

        <div class="color-row">

          <input
            id="bgColor"
            type="color"
            value="#ffffff">

          <input
            id="bgText"
            type="text"
            value="#ffffff">

        </div>

      </div>

    </div>


    <div style="height:12px"></div>


    <div class="inline">

      <span class="check">

        <input
          id="gradientEnabled"
          type="checkbox">

        <span data-i18n="gradient">
          Farbverlauf
        </span>

      </span>

    </div>


    <div
      id="gradientSettings"
      class="hidden"
      style="margin-top:12px">

      <div class="grid2">

        <div>

          <label data-i18n="gradientColor">
            Verlaufsfarbe
          </label>

          <input
            id="gradientColor"
            type="color"
            value="#6677ff">

        </div>


        <div>

          <label data-i18n="direction">
            Richtung
          </label>

          <select id="gradientDirection">

            <option
              value="horizontal"
              data-i18n="horizontal">
              Horizontal
            </option>

            <option
              value="vertical"
              data-i18n="vertical">
              Vertikal
            </option>

            <option
              value="diagonal"
              data-i18n="diagonal">
              Diagonal
            </option>

          </select>

        </div>

      </div>

    </div>


    <div style="height:12px"></div>


    <label data-i18n="moduleStyle">
      Modulstil
    </label>

    <div
      class="segment"
      id="moduleStyle"
      style="grid-template-columns:repeat(4,1fr)">

      <button
        class="active"
        data-style="square"
        data-i18n="square">
        Quadrat
      </button>

      <button
        data-style="rounded"
        data-i18n="rounded">
        Rund
      </button>

      <button
        data-style="dot"
        data-i18n="dots">
        Punkte
      </button>

      <button
        data-style="soft"
        data-i18n="soft">
        Soft
      </button>

    </div>

  </div>


  <!-- LOGO -->

  <div class="section">

    <div class="section-title">

      <strong data-i18n="logo">
        Logo
      </strong>

      <small data-i18n="optional">
        Optional
      </small>

    </div>


    <div
      class="logo-drop"
      id="logoDrop">

      <div data-i18n="logoDrop">
        Logo hier hineinziehen
      </div>

      <button
        id="logoChoose"
        data-i18n="chooseFile">
        Datei auswählen
      </button>

      <input
        id="logoFile"
        type="file"
        accept="image/png,image/jpeg,image/webp,image/svg+xml">

    </div>


    <div
      class="logo-preview"
      id="logoPreview">

      <img id="logoThumb">

      <div
        class="logo-name"
        id="logoName">
      </div>

      <button
        class="remove-logo"
        id="removeLogo">
        ×
      </button>

    </div>


    <div
      id="logoSettings"
      class="hidden"
      style="margin-top:12px">

      <label data-i18n="position">
        Position
      </label>

      <div
        class="segment"
        id="logoPosition"
        style="grid-template-columns:repeat(3,1fr)">

        <button
          class="active"
          data-position="center"
          data-i18n="center">
          Mitte
        </button>

        <button
          data-position="bottomLeft"
          data-i18n="bottomLeft">
          Unten links
        </button>

        <button
          data-position="bottomRight"
          data-i18n="bottomRight">
          Unten rechts
        </button>

      </div>


      <div style="height:10px"></div>


      <label data-i18n="shape">
        Form
      </label>

      <div
        class="segment"
        id="logoShape"
        style="grid-template-columns:1fr 1fr">

        <button
          class="active"
          data-shape="round"
          data-i18n="round">
          Rund
        </button>

        <button
          data-shape="square"
          data-i18n="square">
          Quadratisch
        </button>

      </div>


      <div style="height:12px"></div>


      <div class="inline">

        <label
          style="margin:0"
          data-i18n="logoSize">
          Logo-Größe
        </label>

        <strong id="logoSizeValue">
          18%
        </strong>

      </div>

      <input
        class="range"
        id="logoSize"
        type="range"
        min="8"
        max="24"
        value="18">


      <div style="height:10px"></div>


      <label class="check">

        <input
          id="logoWhite"
          type="checkbox"
          checked>

        <span data-i18n="logoBacking">
          Weiße Sicherheitsfläche
        </span>

      </label>

    </div>

  </div>


  <!-- QR SETTINGS -->

  <div class="section">

    <div class="section-title">

      <strong data-i18n="qrSettings">
        QR-Einstellungen
      </strong>

    </div>


    <div class="grid2">

      <div>

        <label data-i18n="errorCorrection">
          Fehlerkorrektur
        </label>

        <select id="ecc">

          <option value="L">
            L — 7%
          </option>

          <option
            value="M"
            selected>
            M — 15%
          </option>

          <option value="Q">
            Q — 25%
          </option>

          <option value="H">
            H — 30%
          </option>

        </select>

      </div>


      <div>

        <label data-i18n="margin">
          Rand
        </label>

        <input
          id="margin"
          type="range"
          class="range"
          min="2"
          max="8"
          value="4">

      </div>

    </div>

  </div>


  <button
    class="primary"
    id="generate"
    data-i18n="generate">
    QR-Code erstellen
  </button>

</section>


<!-- =====================================================
     PREVIEW
===================================================== -->

<section class="panel preview">

  <div class="tabs">

    <button
      class="tab active"
      data-view="preview"
      data-i18n="preview">
      Vorschau
    </button>

    <button
      class="tab"
      data-view="health"
      data-i18n="health">
      QR Health
    </button>

  </div>


  <div
    id="previewView"
    class="qr-area">

    <div class="qr-stage">

      <canvas
        id="qrCanvas"
        class="hidden">
      </canvas>


      <div
        class="empty"
        id="emptyState">

        <div class="empty-inner">

          <div class="empty-icon">
            ⌗

async function googleLogin(){

  email,
  password
){

  await signInWithEmailAndPassword(
    auth,

    password
  );

}


async function createAccount(
  email,
  password
){

  await createUserWithEmailAndPassword(
    auth,
    email,
    password
  );

}


async function changePassword(
  newPassword
){

  const user =
    auth.currentUser;

  if(!user){
    throw new Error(
      "NOT_LOGGED_IN"
    );
  }

  await updatePassword(
    user,
    newPassword
  );

}


async function removeAccount(){

  const user =
    auth.currentUser;

  if(!user){
    throw new Error(
      "NOT_LOGGED_IN"
    );
  }

  /*
   * Die eigentlichen QRForge-Accountdaten
   * können hier später ebenfalls gelöscht werden.
   */

  await deleteUser(user);

}


async function logout(){

  await signOut(auth);

function showAuthError(error){

  const el =
    document.getElementById(
      "authMessage"
    );

  const code =
    error?.code || "";

  const messages = {

    "auth/invalid-email":
      "Ungültige E-Mail-Adresse.",

    "auth/invalid-credential":
      "E-Mail oder Passwort ist falsch.",

    "auth/email-already-in-use":
      "Diese E-Mail-Adresse wird bereits verwendet.",

    "auth/weak-password":
      "Das Passwort ist zu schwach.",

    "auth/popup-closed-by-user":
      "Anmeldung abgebrochen."

  };

  el.textContent =
    messages[code] ||
    error.message ||
    "Anmeldung fehlgeschlagen.";

}

onAuthStateChanged(
  auth,
  user=>{

    window.qrUser =
      user || null;

    if(user){

      loggedOut.classList.add(
        "hidden"
      );

      loggedIn.classList.remove(
        "hidden"
      );

      accountButton.classList.add(
        "visible"
      );

      document.getElementById(
        "currentEmail"
      ).textContent =
        user.email || "Google Account";

      const provider =
        user.providerData?.[0]?.providerId;

      document.getElementById(
        "currentProvider"
      ).textContent =
        provider === "google.com"
          ? "Google"
          : "E-Mail / Passwort";

      /*
       * Google Accounts haben kein
       * QRForge-Passwort, das hier geändert
       * werden könnte.
       */

      document.getElementById(
        "passwordSection"
      ).classList.toggle(
        "hidden",
        provider === "google.com"
      );

    }else{

      loggedOut.classList.remove(
        "hidden"
      );

      loggedIn.classList.add(
        "hidden"
      );

      accountButton.classList.remove(
        "visible"
      );

    }

    window.dispatchEvent(
      new CustomEvent(
        "qrforge-auth-change",
        {
          detail:{
            user
          }
        }
      )
    );

  }
);

function bindColor(
  color,
  text,
  key
){

  document.getElementById(
    color
  ).oninput=e=>{

    state[key] =
      e.target.value;

    document.getElementById(
      text
    ).value =
      e.target.value;

  };


  document.getElementById(
    text
  ).onchange=e=>{

    if(
      /^#[0-9a-f]{6}$/i.test(
        e.target.value
      )
    ){

      state[key] =
        e.target.value;

      document.getElementById(
        color
      ).value =
        e.target.value;

    }

  };

}

function getPayload(){

  if(state.type==="url"){

    return document
      .getElementById(
        "mainInput"
      )?.value
      .trim() || "";

  }


  if(state.type==="text"){

    return document
      .getElementById(
        "mainInput"
      )?.value || "";

  }


  if(state.type==="wifi"){

    const ssid =
      document.getElementById(
        "wifiSSID"
      )?.value || "";

    const pass =
      document.getElementById(
        "wifiPassword"
      )?.value || "";

    const security =
      document.getElementById(
        "wifiSecurity"
      )?.value || "WPA";


    return (
      `WIFI:T:${security};`+
      `S:${escapeWifi(ssid)};`+
      `P:${escapeWifi(pass)};;`
    );

  }


  if(state.type==="email"){

    const address =
      document.getElementById(
        "emailAddress"
      )?.value
      .trim() || "";

    const subject =
      document.getElementById(
        "emailSubject"
      )?.value || "";

    const body =
      document.getElementById(
        "emailBody"
      )?.value || "";


    return (
      `MATMSG:TO:${address};`+
      `SUB:${subject};`+
      `BODY:${body};;`
    );

  }


  return "";

}


function escapeWifi(value){

  return value.replace(
    /([\\;,:"])/g,
    "\\$1"
  );

}


/* =====================================================
   GENERATE
===================================================== */

document.getElementById(
  "generate"
).onclick =
  generate;


function generate(){

  const payload =
    getPayload();

  if(!payload){
    return;
  }


  /*
   * Logos brauchen hohe
   * Fehlerkorrektur.
   */

  if(
    state.logo &&
    state.ecc!=="H"
  ){

    state.ecc="H";

    document.getElementById(
      "ecc"
    ).value="H";

  }


  try{

    const qr =
      qrcode(
        0,
        state.ecc
      );

    qr.addData(
      payload
    );

    qr.make();


    const oldMatrix =
      state.matrix;

    const size =
      qr.getModuleCount();

    const matrix=[];


    for(
      let y=0;
      y<size;
      y++
    ){

      matrix[y]=[];

      for(
        let x=0;
        x<size;
        x++
      ){

        matrix[y][x] =
          qr.isDark(
            y,
            x
          );

      }

    }


    state.lastMatrix =
      oldMatrix;

    state.matrix =
      matrix;

    state.qr =
      qr;


    drawMorph(
      oldMatrix,
      matrix
    );


    document.getElementById(
      "emptyState"
    ).classList.add(
      "hidden"
    );


    document.getElementById(
      "qrCanvas"
    ).classList.remove(
      "hidden"
    );


    updateHealth();

  }catch(error){

    console.error(
      "QR generation failed:",
      error
    );

  }

}


/* =====================================================
   DRAW
===================================================== */

function drawMorph(
  oldMatrix,
  newMatrix
){

  const canvas =
    document.getElementById(
      "qrCanvas"
    );

  const ctx =
    canvas.getContext(
      "2d"
    );

  const SIZE=1000;

  canvas.width=SIZE;
  canvas.height=SIZE;


  canvas.classList.remove(
    "morph"
  );

  void canvas.offsetWidth;

  canvas.classList.add(
    "morph"
  );


  drawQR(
    ctx,
    newMatrix,
    SIZE
  );


  if(
    oldMatrix &&
    oldMatrix.length===
    newMatrix.length
  ){

    setTimeout(()=>{

      const start =
        performance.now();

      const duration =
        560;


      function frame(now){

        const progress =
          Math.min(
            1,
            (now-start)/
            duration
          );


        const ease =
          1-
          Math.pow(
            1-progress,
            3
          );


        ctx.clearRect(
          0,
          0,
          SIZE,
          SIZE
        );


        drawQR(
          ctx,
          newMatrix,
          SIZE,
          ease,
          oldMatrix
        );


        if(progress<1){

          requestAnimationFrame(
            frame
          );

        }else{

          drawQR(
            ctx,
            newMatrix,
            SIZE
          );

        }

      }


      requestAnimationFrame(
        frame
      );

    },80);

  }

}


/* =====================================================
   QR RENDERER
===================================================== */

function drawQR(
  ctx,
  matrix,
  size,
  morph=1,
  oldMatrix=null
){

  const n =
    matrix.length;

  const margin =
    state.margin;

  const cell =
    size/
    (n+margin*2);


  ctx.clearRect(
    0,
    0,
    size,
    size
  );


  ctx.fillStyle =
    state.bg;

  ctx.fillRect(
    0,
    0,
    size,
    size
  );


  let gradient=null;


  if(state.gradient){

    if(
      state.gradientDirection===
      "vertical"
    ){

      gradient =
        ctx.createLinearGradient(
          0,
          0,
          0,
          size
        );

    }else if(
      state.gradientDirection===
      "diagonal"
    ){

      gradient =
        ctx.createLinearGradient(
          0,
          0,
          size,
          size
        );

    }else{

      gradient =
        ctx.createLinearGradient(
          0,
          0,
          size,
          0
        );

    }


    gradient.addColorStop(
      0,
      state.fg
    );

    gradient.addColorStop(
      1,
      state.gradientColor
    );

  }


  ctx.fillStyle =
    gradient ||
    state.fg;


  for(
    let y=0;
    y<n;
    y++
  ){

    for(
      let x=0;
      x<n;
      x++
    ){

      if(!matrix[y][x]){
        continue;
      }


      if(
        isFinderArea(
          x,
          y,
          n
        )
      ){

        continue;

      }


      const px =
        (x+margin)*
        cell;

      const py =
        (y+margin)*
        cell;


      let alpha=1;


      if(oldMatrix){

        const was =
          oldMatrix[y]?.[x] ||
          false;

        const is =
          matrix[y][x];


        if(was!==is){
          alpha=morph;
        }

      }


      ctx.globalAlpha =
        alpha;


      drawModule(
        ctx,
        px,
        py,
        cell
      );


      ctx.globalAlpha=1;

    }

  }


  drawFinder(
    ctx,
    0,
    0,
    cell,
    margin
  );


  drawFinder(
    ctx,
    n-7,
    0,
    cell,
    margin
  );


  drawFinder(
    ctx,
    0,
    n-7,
    cell,
    margin
  );


  if(state.logo){

    drawLogo(
      ctx,
      size,
      cell,
      n,
      margin
    );

  }

}


function isFinderArea(
  x,
  y,
  n
){

  const areas=[

    [0,0],

    [n-7,0],

    [0,n-7]

  ];


  return areas.some(
    ([ax,ay])=>

      x>=ax &&
      x<ax+7 &&
      y>=ay &&
      y<ay+7

  );

}


function drawFinder(
  ctx,
  x,
  y,
  cell,
  margin
){

  const px =
    (x+margin)*
    cell;

  const py =
    (y+margin)*
    cell;

  const size =
    7*cell;


  ctx.fillStyle =
    state.fg;

  ctx.fillRect(
    px,
    py,
    size,
    size
  );


  ctx.fillStyle =
    state.bg;

  ctx.fillRect(
    px+cell,
    py+cell,
    5*cell,
    5*cell
  );


  ctx.fillStyle =
    state.gradient
      ? state.fg
      : state.fg;

  ctx.fillRect(
    px+2*cell,
    py+2*cell,
    3*cell,
    3*cell
  );

}


function drawModule(
  ctx,
  x,
  y,
  size
){

  const radius =

    state.style==="rounded"
      ? size*.25

    : state.style==="dot"
      ? size*.48

    : state.style==="soft"
      ? size*.16

    : 0;


  if(radius===0){

    ctx.fillRect(
      x,
      y,
      size,
      size
    );

    return;

  }


  ctx.beginPath();

  ctx.roundRect(
    x,
    y,
    size,
    size,
    radius
  );

  ctx.fill();

}


/* =====================================================
   LOGO RENDER
===================================================== */

function drawLogo(
  ctx,
  size,
  cell,
  n,
  margin
){

  const logoSize =
    size*
    (state.logoSize/100);


  let cx =
    size/2;

  let cy =
    size/2;


  if(
    state.logoPosition===
    "bottomLeft"
  ){

    cx =
      logoSize*.72;

    cy =
      size-
      logoSize*.72;

  }


  if(
    state.logoPosition===
    "bottomRight"
  ){

    cx =
      size-
      logoSize*.72;

    cy =
      size-
      logoSize*.72;

  }


  const safeSize =
    logoSize*
    1.24;


  ctx.save();


  if(
    state.logoWhite
  ){

    ctx.fillStyle =
      state.bg;


    if(
      state.logoShape===
      "round"
    ){

      ctx.beginPath();

      ctx.arc(
        cx,
        cy,
        safeSize/2,
        0,
        Math.PI*2
      );

      ctx.fill();

    }else{

      ctx.fillRect(
        cx-safeSize/2,
        cy-safeSize/2,
        safeSize,
        safeSize
      );

    }

  }


  const img =
    new Image();


  img.onload=()=>{

    ctx.save();


    if(
      state.logoShape===
      "round"
    ){

      ctx.beginPath();

      ctx.arc(
        cx,
        cy,
        logoSize/2,
        0,
        Math.PI*2
      );

      ctx.clip();

    }else{

      ctx.beginPath();

      ctx.roundRect(
        cx-logoSize/2,
        cy-logoSize/2,
        logoSize,
        logoSize,
        logoSize*.14
      );

      ctx.clip();

    }


    const ratio =
      Math.min(
        logoSize/img.width,
        logoSize/img.height
      );


    const width =
      img.width*ratio;

    const height =
      img.height*ratio;


    ctx.drawImage(
      img,
      cx-width/2,
      cy-height/2,
      width,
      height
    );


    ctx.restore();
    ctx.restore();

  };


  img.src =
    state.logo.data;

}


/* =====================================================
   HEALTH
===================================================== */

function updateHealth(){

  if(!state.matrix){

    document.getElementById(
      "healthScore"
    ).textContent="—";

    document.getElementById(
      "healthFill"
    ).style.width="0";

    document.getElementById(
      "miniHealth"
    ).style.width="0";

    document.getElementById(
      "miniHealthText"
    ).textContent="—";

    return;

  }


  const n =
    state.matrix.length;


  let score=100;


  const contrast =
    contrastRatio(
      state.fg,
      state.bg
    );


  if(
    contrast<7
  ){

    score-=15;

  }


  if(
    contrast<4.5
  ){

    score-=25;

  }


  if(
    state.margin<4
  ){

    score-=12;

  }


  if(
    n>45
  ){

    score-=7;

  }


  if(
    n>60
  ){

    score-=8;

  }


  if(
    state.style==="dot"
  ){

    score-=3;

  }


  if(state.logo){

    if(
      state.logoSize>20
    ){

      score-=15;

    }

    if(
      state.logoSize>23
    ){

      score-=15;

    }

  }


  score =
    Math.max(
      0,
      Math.min(
        100,
        score
      )
    );


  document.getElementById(
    "healthScore"
  ).textContent =
    score+"/100";


  document.getElementById(
    "healthFill"
  ).style.width =
    score+"%";


  document.getElementById(
    "miniHealth"
  ).style.width =
    score+"%";


  document.getElementById(
    "miniHealthText"
  ).textContent =
    t("scanability")+
    " "+
    score+
    "/100";


  const contrastStatus =
    contrast>=7
      ? "good"
      : contrast>=4.5
        ? "warn"
        : "bad";


  const marginStatus =
    state.margin>=4
      ? "good"
      : "warn";


  const logoStatus =
    !state.logo
      ? "good"
      : state.logoSize<=20
        ? "good"
        : state.logoSize<=23
          ? "warn"
          : "bad";


  const items=[

    [
      t("contrast"),
      contrast.toFixed(2)+":1",
      contrastStatus
    ],

    [
      t("quiet"),
      state.margin+"×",
      marginStatus
    ],

    [
      t("modules"),
      n+" × "+n,
      n<50
        ? "good"
        : "warn"
    ],

    [
      t("logoCoverage"),
      state.logo
        ? state.logoSize+"%"
        : "—",
      logoStatus
    ],

    [
      t("complexity"),
      n<=29
        ? "Low"
        : n<=49
          ? "Medium"
          : "High",
      n<=49
        ? "good"
        : "warn"
    ],

    [
      t("correction"),
      state.ecc,
      "good"
    ]

  ];


  document.getElementById(
    "healthList"
  ).innerHTML =
    items.map(item=>`

      <div class="health-item">

        <span>
          ${item[0]}
        </span>

        <span class="${item[2]}">

          <strong>
            ${item[1]}
          </strong>

        </span>

      </div>

    `).join("");

}


/* =====================================================
   CONTRAST
===================================================== */

function contrastRatio(
  foreground,
  background
){

  function luminance(
    color
  ){

    const rgb=[

      parseInt(
        color.slice(1,3),
        16
      )/255,

      parseInt(
        color.slice(3,5),
        16
      )/255,

      parseInt(
        color.slice(5,7),
        16
      )/255

    ].map(
      value=>
        value<=.03928
          ? value/12.92
          : Math.pow(
              (value+.055)/
              1.055,
              2.4
            )
    );


    return (
      .2126*rgb[0]+
      .7152*rgb[1]+
      .0722*rgb[2]
    );

  }


  const l1 =
    luminance(
      foreground
    );

  const l2 =
    luminance(
      background
    );


  return (
    Math.max(l1,l2)+.05
  )/
  (
    Math.min(l1,l2)+.05
  );

}

function createSVG(){

  const matrix =
    state.matrix;

  const n =
    matrix.length;

  const margin =
    state.margin;

  const total =
    n+margin*2;

  const cell =
    1000/total;


  const gradientId =
    "qrGradient";


  const logoClipId =
    "qrLogoClip";


  let defs="";


  if(state.gradient){

    let x1="0%";
    let y1="0%";
    let x2="100%";
    let y2="0%";


    if(
      state.gradientDirection===
      "vertical"
    ){

      x2="0%";
      y2="100%";

    }


    if(
      state.gradientDirection===
      "diagonal"
    ){

      x2="100%";
      y2="100%";

    }


    defs+=`

      <linearGradient
        id="${gradientId}"
        x1="${x1}"
        y1="${y1}"
        x2="${x2}"
        y2="${y2}">

        <stop
          offset="0%"
          stop-color="${state.fg}"/>

        <stop
          offset="100%"
          stop-color="${state.gradientColor}"/>

      </linearGradient>

    `;

  }


  let body=`

    <rect
      width="1000"
      height="1000"
      fill="${state.bg}"/>

  `;


  const fill =
    state.gradient
      ? `url(#${gradientId})`
      : state.fg;


  for(
    let y=0;
    y<n;
    y++
  ){

    for(
      let x=0;
      x<n;
      x++
    ){

      if(
        !matrix[y][x]
      ){
        continue;
      }


      if(
        isFinderArea(
          x,
          y,
          n
        )
      ){

        continue;

      }


      const px =
        (x+margin)*
        cell;

      const py =
        (y+margin)*
        cell;


      const radius =

        state.style===
        "rounded"

          ? cell*.25

        : state.style===
          "dot"

          ? cell*.48

        : state.style===
          "soft"

          ? cell*.16

        : 0;


      body+=`

        <rect
          x="${px}"
          y="${py}"
          width="${cell}"
          height="${cell}"
          rx="${radius}"
          fill="${fill}"/>

      `;

    }

  }


  function finder(
    x,
    y
  ){

    const px =
      (x+margin)*
      cell;

    const py =
      (y+margin)*
      cell;

    const size =
      7*cell;


    return `

      <rect
        x="${px}"
        y="${py}"
        width="${size}"
        height="${size}"
        fill="${state.fg}"/>

      <rect
        x="${px+cell}"
        y="${py+cell}"
        width="${5*cell}"
        height="${5*cell}"
        fill="${state.bg}"/>

      <rect
        x="${px+2*cell}"
        y="${py+2*cell}"
        width="${3*cell}"
        height="${3*cell}"
        fill="${fill}"/>

    `;

  }


  body+=
    finder(0,0);

  body+=
    finder(n-7,0);

  body+=
    finder(0,n-7);


  if(state.logo){

    const logoSize =
      1000*
      (state.logoSize/100);


    let cx=500;
    let cy=500;


    if(
      state.logoPosition===
      "bottomLeft"
    ){

      cx =
        logoSize*.72;

      cy =
        1000-
        logoSize*.72;

    }


    if(
      state.logoPosition===
      "bottomRight"
    ){

      cx =
        1000-
        logoSize*.72;

      cy =
        1000-
        logoSize*.72;

    }


    const safe =
      logoSize*1.24;


    defs+=`

      <clipPath
        id="${logoClipId}">

        ${
          state.logoShape===
          "round"

            ? `
              <circle
                cx="${cx}"
                cy="${cy}"
                r="${logoSize/2}"/>
            `

            : `
              <rect
                x="${cx-logoSize/2}"
                y="${cy-logoSize/2}"
                width="${logoSize}"
                height="${logoSize}"
                rx="${logoSize*.14}"/>
            `
        }

      </clipPath>

    `;


    if(
      state.logoWhite
    ){

      body+=
        state.logoShape===
        "round"

          ? `
            <circle
              cx="${cx}"
              cy="${cy}"
              r="${safe/2}"
              fill="${state.bg}"/>
          `

          : `
            <rect
              x="${cx-safe/2}"
              y="${cy-safe/2}"
              width="${safe}"
              height="${safe}"
              rx="${safe*.14}"
              fill="${state.bg}"/>
          `;

    }


    body+=`

      <image
        href="${state.logo.data}"
        x="${cx-logoSize/2}"
        y="${cy-logoSize/2}"
        width="${logoSize}"
        height="${logoSize}"
        preserveAspectRatio="xMidYMid meet"
        clip-path="url(#${logoClipId})"/>

    `;

  }


  return `

    <svg
      xmlns="http://www.w3.org/2000/svg"
      xmlns:xlink="http://www.w3.org/1999/xlink"
      viewBox="0 0 1000 1000"
      width="1000"
      height="1000">

      <defs>
        ${defs}
      </defs>

      ${body}

    </svg>

  `;

}


/* =====================================================
   INIT
===================================================== */

applyLanguage();

renderContent();


/* =====================================================
   GLOBAL QR STATS API
   Nur vorbereitet.
   Noch keine Analytics-Oberfläche.
===================================================== */

window.qrForgeStats = {

  async increment(
    qrId
  ){

    if(!qrId){
      return;
    }


    const statsRef =
      ref(
        database,
        "qrStats/"+qrId
      );


    await update(
      statsRef,
      {

        scans:
          increment(1),

        lastScan:
          Date.now()

      }
    );

  },


  async get(
    qrId
  ){

    if(!qrId){
      return null;
    }


    const snapshot =
      await get(
        ref(
          database,
          "qrStats/"+qrId
        )
      );


    return snapshot.exists()
      ? snapshot.val()
      : {
          scans:0
        };

  }

};

</script>
