<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QRForge — QR Code Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

<style>
:root{
  --bg:#07090d;
  --panel:rgba(255,255,255,.055);
  --panel2:rgba(255,255,255,.075);
  --border:rgba(255,255,255,.10);
  --text:#f7f8fa;
  --muted:#9299a6;
  --accent:#7c8cff;
  --good:#4ade80;
  --warn:#fbbf24;
  --bad:#fb7185;
  --radius:24px;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 15% 0%,rgba(124,140,255,.13),transparent 30%),
    radial-gradient(circle at 85% 15%,rgba(0,200,255,.08),transparent 28%),
    var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input,select,textarea{font:inherit}

button{
  border:0;
  color:inherit;
  cursor:pointer;
}

.app{
  width:min(1450px,100%);
  margin:auto;
  padding:22px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brandmark{
  width:42px;
  height:42px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#fff,#7c8cff);
  color:#090a0e;
  font-weight:900;
  box-shadow:0 8px 35px rgba(124,140,255,.28);
}

.brand h1{
  margin:0;
  font-size:19px;
  letter-spacing:-.03em;
}

.brand span{
  color:var(--muted);
  font-size:12px;
}

.lang{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:10px 13px;
  backdrop-filter:blur(18px);
  display:flex;
  gap:8px;
  align-items:center;
}

.layout{
  display:grid;
  grid-template-columns:minmax(300px,430px) minmax(400px,1fr);
  gap:20px;
}

.panel{
  background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025));
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:0 25px 80px rgba(0,0,0,.28);
  backdrop-filter:blur(25px);
}

.controls{
  padding:20px;
}

.preview{
  min-height:720px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.tabs{
  display:flex;
  gap:7px;
  padding:7px;
  border-bottom:1px solid var(--border);
}

.tab{
  flex:1;
  background:transparent;
  color:var(--muted);
  padding:11px;
  border-radius:13px;
  transition:.2s;
}

.tab.active{
  color:#fff;
  background:rgba(255,255,255,.09);
}

.section{
  margin-bottom:22px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.section-title strong{
  font-size:13px;
}

.section-title small{
  color:var(--muted);
}

label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:7px;
}

input[type=text],
input[type=url],
textarea,
select{
  width:100%;
  border:1px solid var(--border);
  background:rgba(0,0,0,.2);
  color:var(--text);
  border-radius:13px;
  padding:12px 13px;
  outline:none;
  transition:.2s;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input:focus,textarea:focus,select:focus{
  border-color:rgba(124,140,255,.65);
  box-shadow:0 0 0 3px rgba(124,140,255,.09);
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.segment{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:4px;
  background:rgba(0,0,0,.18);
  border:1px solid var(--border);
  border-radius:13px;
  gap:4px;
}

.segment button{
  padding:9px 4px;
  border-radius:9px;
  background:transparent;
  color:var(--muted);
  font-size:12px;
}

.segment button.active{
  background:rgba(255,255,255,.11);
  color:#fff;
}

.color-row{
  display:grid;
  grid-template-columns:52px 1fr;
  gap:8px;
}

input[type=color]{
  width:52px;
  height:43px;
  border:1px solid var(--border);
  border-radius:12px;
  padding:4px;
  background:transparent;
}

.check{
  display:flex;
  align-items:center;
  gap:9px;
  color:#cbd0da;
  font-size:13px;
}

.check input{
  accent-color:var(--accent);
}

.range{
  width:100%;
  accent-color:var(--accent);
}

.logo-drop{
  border:1px dashed rgba(255,255,255,.2);
  border-radius:16px;
  padding:18px;
  text-align:center;
  background:rgba(255,255,255,.025);
  transition:.2s;
}

.logo-drop.drag{
  border-color:var(--accent);
  background:rgba(124,140,255,.08);
}

.logo-drop button{
  background:rgba(255,255,255,.09);
  padding:9px 14px;
  border-radius:10px;
  margin-top:8px;
}

#logoFile{display:none}

.logo-preview{
  display:none;
  align-items:center;
  justify-content:space-between;
  margin-top:10px;
  padding:10px;
  border:1px solid var(--border);
  border-radius:13px;
}

.logo-preview img{
  width:45px;
  height:45px;
  object-fit:contain;
  border-radius:10px;
  background:white;
}

.remove-logo{
  background:rgba(255,100,100,.12);
  color:#ff8c8c;
  padding:8px 10px;
  border-radius:9px;
}

.primary{
  width:100%;
  padding:14px;
  border-radius:14px;
  background:linear-gradient(135deg,#8997ff,#6174ff);
  color:white;
  font-weight:750;
  box-shadow:0 12px 35px rgba(97,116,255,.22);
  transition:.2s;
}

.primary:hover{
  transform:translateY(-1px);
  filter:brightness(1.08);
}

.secondary{
  padding:11px 13px;
  border-radius:12px;
  background:rgba(255,255,255,.075);
  border:1px solid var(--border);
}

.export-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.qr-area{
  flex:1;
  display:grid;
  place-items:center;
  padding:35px;
  position:relative;
  overflow:hidden;
}

.qr-stage{
  width:min(520px,90%);
  aspect-ratio:1;
  display:grid;
  place-items:center;
  position:relative;
}

#qrCanvas{
  width:100%;
  height:100%;
  max-width:520px;
  max-height:520px;
  background:white;
  border-radius:4px;
  box-shadow:0 30px 80px rgba(0,0,0,.45);
}

.empty{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  text-align:center;
  color:var(--muted);
  pointer-events:none;
}

.empty-inner{
  max-width:300px;
}

.empty-icon{
  width:75px;
  height:75px;
  margin:auto auto 15px;
  border:1px solid var(--border);
  border-radius:22px;
  display:grid;
  place-items:center;
  font-size:25px;
}

.preview-bottom{
  border-top:1px solid var(--border);
  padding:15px 18px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:15px;
  align-items:center;
}

.health{
  display:flex;
  align-items:center;
  gap:10px;
}

.health-bar{
  width:130px;
  height:7px;
  background:rgba(255,255,255,.08);
  border-radius:99px;
  overflow:hidden;
}

.health-fill{
  width:0;
  height:100%;
  background:var(--good);
  transition:.4s;
}

.stats{
  display:flex;
  gap:15px;
  color:var(--muted);
  font-size:11px;
}

.stats strong{
  color:#fff;
}

.hidden{display:none!important}

.morph{
  animation:qrMorph .65s cubic-bezier(.2,.8,.2,1);
}

@keyframes qrMorph{
  0%{opacity:.2;transform:scale(.93) rotate(-1deg);filter:blur(8px)}
  45%{opacity:1;transform:scale(1.015) rotate(.3deg);filter:blur(0)}
  100%{transform:scale(1)}
}

.fade-in{
  animation:fade .45s ease both;
}

@keyframes fade{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}

.switch{
  position:relative;
  width:42px;
  height:24px;
}

.switch input{
  display:none;
}

.slider{
  position:absolute;
  inset:0;
  background:#272b34;
  border-radius:20px;
  cursor:pointer;
  transition:.2s;
}

.slider:before{
  content:"";
  position:absolute;
  width:18px;
  height:18px;
  top:3px;
  left:3px;
  background:#fff;
  border-radius:50%;
  transition:.2s;
}

.switch input:checked+.slider{
  background:var(--accent);
}

.switch input:checked+.slider:before{
  transform:translateX(18px);
}

.inline{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.health-card{
  padding:14px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.025);
  border-radius:15px;
}

.health-list{
  display:grid;
  gap:8px;
}

.health-item{
  display:flex;
  justify-content:space-between;
  gap:12px;
  font-size:12px;
  color:var(--muted);
}

.good{color:var(--good)}
.warn{color:var(--warn)}
.bad{color:var(--bad)}

@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .preview{min-height:600px}
}

@media(max-width:550px){
  .app{padding:12px}
  .controls{padding:15px}
  .qr-area{padding:18px}
  .topbar{margin-bottom:12px}
  .stats{display:none}
  .grid3{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="app">

<header class="topbar">
  <div class="brand">
    <div class="brandmark">QR</div>
    <div>
      <h1>QRForge</h1>
      <span data-i18n="subtitle">Professional QR Studio</span>
    </div>
  </div>

  <button class="lang" id="langBtn">🇩🇪 <span>Deutsch</span></button>
</header>

<main class="layout">

<section class="panel controls">

  <div class="section">
    <div class="section-title">
      <strong data-i18n="content">Inhalt</strong>
    </div>

    <div class="segment" id="typeTabs">
      <button class="active" data-type="url" data-i18n="url">URL</button>
      <button data-type="text" data-i18n="text">Text</button>
      <button data-type="wifi" data-i18n="wifi">Wi-Fi</button>
      <button data-type="email" data-i18n="email">E-Mail</button>
    </div>
  </div>

  <div id="contentArea" class="section fade-in"></div>

  <div class="section">
    <div class="section-title">
      <strong data-i18n="design">Design</strong>
    </div>

    <div class="grid2">
      <div>
        <label data-i18n="foreground">Vordergrund</label>
        <div class="color-row">
          <input id="fgColor" type="color" value="#111111">
          <input id="fgText" type="text" value="#111111">
        </div>
      </div>

      <div>
        <label data-i18n="background">Hintergrund</label>
        <div class="color-row">
          <input id="bgColor" type="color" value="#ffffff">
          <input id="bgText" type="text" value="#ffffff">
        </div>
      </div>
    </div>

    <div style="height:12px"></div>

    <div class="inline">
      <span class="check">
        <input id="gradientEnabled" type="checkbox">
        <span data-i18n="gradient">Farbverlauf</span>
      </span>
    </div>

    <div id="gradientSettings" class="hidden" style="margin-top:12px">
      <div class="grid2">
        <div>
          <label data-i18n="gradientColor">Verlaufsfarbe</label>
          <input id="gradientColor" type="color" value="#6677ff">
        </div>
        <div>
          <label data-i18n="direction">Richtung</label>
          <select id="gradientDirection">
            <option value="horizontal" data-i18n="horizontal">Horizontal</option>
            <option value="vertical" data-i18n="vertical">Vertikal</option>
            <option value="diagonal" data-i18n="diagonal">Diagonal</option>
          </select>
        </div>
      </div>
    </div>

    <div style="height:12px"></div>

    <label data-i18n="moduleStyle">Modulstil</label>
    <div class="segment" id="moduleStyle">
      <button class="active" data-style="square" data-i18n="square">Quadrat</button>
      <button data-style="rounded" data-i18n="rounded">Rund</button>
      <button data-style="dot" data-i18n="dots">Punkte</button>
      <button data-style="soft" data-i18n="soft">Soft</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">
      <strong data-i18n="logo">Logo</strong>
      <small data-i18n="optional">Optional</small>
    </div>

    <div class="logo-drop" id="logoDrop">
      <div data-i18n="logoDrop">Logo hier hineinziehen</div>
      <button id="logoChoose" data-i18n="chooseFile">Datei auswählen</button>
      <input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml">
    </div>

    <div class="logo-preview" id="logoPreview">
      <img id="logoThumb">
      <div style="flex:1;padding:0 10px">
        <strong id="logoName" style="font-size:12px"></strong>
      </div>
      <button class="remove-logo" id="removeLogo">×</button>
    </div>

    <div id="logoSettings" class="hidden" style="margin-top:12px">

      <label data-i18n="position">Position</label>
      <div class="segment" id="logoPosition">
        <button class="active" data-position="center" data-i18n="center">Mitte</button>
        <button data-position="bottomLeft" data-i18n="bottomLeft">Unten links</button>
        <button data-position="bottomRight" data-i18n="bottomRight">Unten rechts</button>
      </div>

      <div style="height:10px"></div>

      <label data-i18n="shape">Form</label>
      <div class="segment" id="logoShape">
        <button class="active" data-shape="round" data-i18n="round">Rund</button>
        <button data-shape="square" data-i18n="square">Quadratisch</button>
      </div>

      <div style="height:12px"></div>

      <div class="inline">
        <label style="margin:0" data-i18n="logoSize">Logo-Größe</label>
        <strong id="logoSizeValue">18%</strong>
      </div>
      <input class="range" id="logoSize" type="range" min="8" max="24" value="18">

      <div style="height:10px"></div>

      <div class="inline">
        <span class="check">
          <input id="logoWhite" type="checkbox" checked>
          <span data-i18n="logoBacking">Weiße Sicherheitsfläche</span>
        </span>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">
      <strong data-i18n="qrSettings">QR-Einstellungen</strong>
    </div>

    <div class="grid2">
      <div>
        <label data-i18n="errorCorrection">Fehlerkorrektur</label>
        <select id="ecc">
          <option value="L">L — 7%</option>
          <option value="M" selected>M — 15%</option>
          <option value="Q">Q — 25%</option>
          <option value="H">H — 30%</option>
        </select>
      </div>

      <div>
        <label data-i18n="margin">Rand</label>
        <input id="margin" type="range" class="range" min="2" max="8" value="4">
      </div>
    </div>
  </div>

  <button class="primary" id="generate" data-i18n="generate">
    QR-Code erstellen
  </button>

</section>

<section class="panel preview">

  <div class="tabs">
    <button class="tab active" data-view="preview" data-i18n="preview">Vorschau</button>
    <button class="tab" data-view="health" data-i18n="health">QR Health</button>
  </div>

  <div id="previewView" class="qr-area">

    <div class="qr-stage">
      <canvas id="qrCanvas" class="hidden"></canvas>

      <div class="empty" id="emptyState">
        <div class="empty-inner">
          <div class="empty-icon">⌗</div>
          <strong data-i18n="emptyTitle">Dein QR-Code erscheint hier</strong>
          <div style="margin-top:6px;font-size:12px" data-i18n="emptyText">
            Inhalt eingeben und QR-Code erstellen.
          </div>
        </div>
      </div>
    </div>

  </div>

  <div id="healthView" class="qr-area hidden">
    <div style="width:min(600px,100%)">

      <div class="health-card" style="margin-bottom:12px">
        <div class="inline">
          <strong data-i18n="scanability">Scanbarkeit</strong>
          <strong id="healthScore">—</strong>
        </div>

        <div class="health-bar" style="width:100%;margin-top:12px">
          <div class="health-fill" id="healthFill"></div>
        </div>
      </div>

      <div class="health-list" id="healthList">
        <div class="health-item">
          <span data-i18n="createFirst">Erstelle zuerst einen QR-Code.</span>
          <span>—</span>
        </div>
      </div>

    </div>
  </div>

  <div class="preview-bottom">

    <div class="health">
      <div class="health-bar">
        <div class="health-fill" id="miniHealth"></div>
      </div>
      <span id="miniHealthText" style="font-size:12px;color:var(--muted)">
        —
      </span>
    </div>

    <div class="export-row">
      <button class="secondary" id="downloadPNG" data-i18n="png">PNG</button>
      <button class="secondary" id="downloadSVG" data-i18n="svg">SVG</button>
    </div>

  </div>

</section>

</main>
</div>

/* GET CONTENT */

function getPayload(){

  if(state.type==="url"){
    return $("mainInput")?.value.trim() || "";
  }

  if(state.type==="text"){
    return $("mainInput")?.value || "";
  }

  if(state.type==="wifi"){
    const ssid=$("wifiSSID")?.value || "";
    const pass=$("wifiPassword")?.value || "";
    const sec=$("wifiSecurity")?.value || "WPA";

    return `WIFI:T:${sec};S:${escapeWifi(ssid)};P:${escapeWifi(pass)};;`;
  }

  if(state.type==="email"){
    const address=$("emailAddress")?.value.trim() || "";
    const subject=$("emailSubject")?.value || "";
    const body=$("emailBody")?.value || "";

    return `MATMSG:TO:${address};SUB:${subject};BODY:${body};;`;
  }

  return "";
}

function escapeWifi(v){
  return v.replace(/([\\;,:"])/g,"\\$1");
}

/* GENERATE */

$("generate").onclick=generate;

function generate(){

  const payload=getPayload();

  if(!payload){
    return;
  }

  const oldMatrix=state.matrix;

  try{

    const qr=qrcode(0,state.ecc);
    qr.addData(payload);
    qr.make();

    state.qr=qr;

    const size=qr.getModuleCount();
    const matrix=[];

    for(let y=0;y<size;y++){
      matrix[y]=[];

      for(let x=0;x<size;x++){
        matrix[y][x]=qr.isDark(y,x);
      }
    }

    state.lastMatrix=oldMatrix;
    state.matrix=matrix;

    drawMorph(oldMatrix,matrix);

    $("emptyState").classList.add("hidden");
    $("qrCanvas").classList.remove("hidden");

    updateHealth();

  }catch(err){
    console.error(err);
  }
}

/* DRAW */

function drawMorph(oldMatrix,newMatrix){

  const canvas=$("qrCanvas");
  const ctx=canvas.getContext("2d");

  const SIZE=1000;

  canvas.width=SIZE;
  canvas.height=SIZE;

  canvas.classList.remove("morph");
  void canvas.offsetWidth;
  canvas.classList.add("morph");

  const target=SIZE;

  drawQR(ctx,newMatrix,target);

  /*
   * Small module morph overlay.
   * When dimensions differ, we still use a clean transition.
   */
  if(oldMatrix && oldMatrix.length===newMatrix.length){

    const old=oldMatrix;

    setTimeout(()=>{

      const start=performance.now();
      const duration=560;

      function frame(now){

        const p=Math.min(1,(now-start)/duration);
        const ease=1-Math.pow(1-p,3);

        ctx.clearRect(0,0,SIZE,SIZE);

        drawQR(ctx,newMatrix,SIZE,ease,old);

        if(p<1){
          requestAnimationFrame(frame);
        }else{
          drawQR(ctx,newMatrix,SIZE);
        }
      }

      requestAnimationFrame(frame);

    },80);
  }
}

/* QR RENDERER */

function drawQR(ctx,matrix,size,morph=1,oldMatrix=null){

  const n=matrix.length;
  const margin=state.margin;

  const cell=size/(n+margin*2);

  ctx.clearRect(0,0,size,size);

  ctx.fillStyle=state.bg;
  ctx.fillRect(0,0,size,size);

  let gradient=null;

  if(state.gradient){

    if(state.gradientDirection==="vertical"){
      gradient=ctx.createLinearGradient(0,0,0,size);
    }else if(state.gradientDirection==="diagonal"){
      gradient=ctx.createLinearGradient(0,0,size,size);
    }else{
      gradient=ctx.createLinearGradient(0,0,size,0);
    }

    gradient.addColorStop(0,state.fg);
    gradient.addColorStop(1,state.gradientColor);
  }

  ctx.fillStyle=gradient || state.fg;

  for(let y=0;y<n;y++){

    for(let x=0;x<n;x++){

      if(!matrix[y][x]) continue;

      if(isFinderArea(x,y,n)){

        drawFinderModule(
          ctx,
          x,y,
          cell,
          margin,
          n
        );

        continue;
      }

      const px=(x+margin)*cell;
      const py=(y+margin)*cell;

      let alpha=1;

      if(oldMatrix){
        const was=oldMatrix[y]?.[x] || false;
        const is=matrix[y][x];

        if(was!==is){
          alpha=morph;
        }
      }

      ctx.globalAlpha=alpha;

      drawModule(ctx,px,py,cell);

      ctx.globalAlpha=1;
    }
  }

  /*
   * Draw finder patterns on top using a proper QR finder geometry.
   */
  drawFinder(ctx,0,0,cell,margin);
  drawFinder(ctx,n-7,0,cell,margin);
  drawFinder(ctx,0,n-7,cell,margin);

  if(state.logo){
    drawLogo(ctx,size,cell,n,margin);
  }
}

/* FINDER */

function isFinderArea(x,y,n){

  const areas=[
    [0,0],
    [n-7,0],
    [0,n-7]
  ];

  return areas.some(([ax,ay]) =>
    x>=ax && x<ax+7 &&
    y>=ay && y<ay+7
  );
}

function drawFinderModule(ctx,x,y,cell,margin,n){
  // handled by complete finder rendering
}

function drawFinder(ctx,x,y,cell,margin){

  const px=(x+margin)*cell;
  const py=(y+margin)*cell;
  const s=7*cell;

  ctx.save();

  ctx.fillStyle=state.bg;
  ctx.fillRect(px,py,s,s);

  ctx.fillStyle=state.gradient
    ? state.fg
    : state.fg;

  ctx.fillRect(px,py,s,s);

  ctx.fillStyle=state.bg;
  ctx.fillRect(
    px+cell,
    py+cell,
    5*cell,
    5*cell
  );

  ctx.fillStyle=state.gradient
    ? state.fg
    : state.fg;

  ctx.fillRect(
    px+2*cell,
    py+2*cell,
    3*cell,
    3*cell
  );

  ctx.restore();
}

function drawModule(ctx,x,y,s){

  const r =
    state.style==="rounded" ? s*.25 :
    state.style==="dot" ? s*.48 :
    state.style==="soft" ? s*.16 :
    0;

  if(r===0){
    ctx.fillRect(x,y,s,s);
    return;
  }

  ctx.beginPath();
  ctx.roundRect(x,y,s,s,r);
  ctx.fill();
}

/* LOGO */

function drawLogo(ctx,size,cell,n,margin){

  const logoSize=size*(state.logoSize/100);

  let cx=size/2;
  let cy=size/2;

  if(state.logoPosition==="bottomLeft"){
    cx=logoSize*.72;
    cy=size-logoSize*.72;
  }

  if(state.logoPosition==="bottomRight"){
    cx=size-logoSize*.72;
    cy=size-logoSize*.72;
  }

  /*
   * Keep logo away from finder patterns.
   */
  const minFinder=size*((7+margin)/(n+margin*2));

  if(
    state.logoPosition!=="center" &&
    logoSize>minFinder*1.7
  ){
    // Conservative placement.
    const safe=logoSize*.68;

    if(state.logoPosition==="bottomLeft"){
      cx=Math.max(safe,size*.16);
      cy=Math.min(size-safe,size*.84);
    }else{
      cx=Math.min(size-safe,size*.84);
      cy=Math.min(size-safe,size*.84);
    }
  }

  const safeSize=logoSize*1.24;

  ctx.save();

  if(state.logoWhite){

    ctx.fillStyle=state.bg;

    if(state.logoShape==="round"){
      ctx.beginPath();
      ctx.arc(cx,cy,safeSize/2,0,Math.PI*2);
      ctx.fill();
    }else{
      ctx.fillRect(
        cx-safeSize/2,
        cy-safeSize/2,
        safeSize,
        safeSize
      );
    }
  }

  const img=new Image();

  img.onload=()=>{

    ctx.save();

    if(state.logoShape==="round"){
      ctx.beginPath();
      ctx.arc(cx,cy,logoSize/2,0,Math.PI*2);
      ctx.clip();
    }else{
      ctx.beginPath();
      ctx.roundRect(
        cx-logoSize/2,
        cy-logoSize/2,
        logoSize,
        logoSize,
        logoSize*.14
      );
      ctx.clip();
    }

    const ratio=Math.min(
      logoSize/img.width,
      logoSize/img.height
    );

    const w=img.width*ratio;
    const h=img.height*ratio;

    ctx.drawImage(
      img,
      cx-w/2,
      cy-h/2,
      w,
      h
    );

    ctx.restore();
    ctx.restore();
  };

  img.src=state.logo.data;
}

/* HEALTH */

function updateHealth(){

  if(!state.matrix){
    $("healthScore").textContent="—";
    $("healthFill").style.width="0";
    $("miniHealth").style.width="0";
    $("miniHealthText").textContent="—";
    return;
  }

  const n=state.matrix.length;

  let score=100;

  const contrast=contrastRatio(state.fg,state.bg);

  if(contrast<7) score-=15;
  if(contrast<4.5) score-=25;

  if(state.margin<4) score-=12;

  if(n>45) score-=7;
  if(n>60) score-=8;

  if(state.style==="dot") score-=3;

  if(state.logo){
    if(state.logoSize>20) score-=15;
    if(state.logoSize>23) score-=15;
    if(state.ecc!=="H") score-=20;
  }

  score=Math.max(0,Math.min(100,score));

  $("healthScore").textContent=score+"/100";
  $("healthFill").style.width=score+"%";
  $("miniHealth").style.width=score+"%";

  $("miniHealthText").textContent =
    t("scanability")+" "+score+"/100";

  const contrastStatus =
    contrast>=7 ? "good" :
    contrast>=4.5 ? "warn" : "bad";

  const marginStatus =
    state.margin>=4 ? "good" : "warn";

  const logoStatus =
    !state.logo ? "good" :
    state.logoSize<=20 ? "good" :
    state.logoSize<=23 ? "warn" : "bad";

  const items=[
    [
      t("contrast"),
      contrast.toFixed(2)+":1",
      contrastStatus,
      contrast>=7?t("highContrast"):t("lowContrast")
    ],
    [
      t("quiet"),
      state.margin+"×",
      marginStatus,
      state.margin>=4?t("sufficientMargin"):t("smallMargin")
    ],
    [
      t("modules"),
      n+" × "+n,
      n<50?"good":"warn",
      n<50?t("healthGood"):t("healthWarn")
    ],
    [
      t("logoCoverage"),
      state.logo?state.logoSize+"%":t("noLogo"),
      logoStatus,
      !state.logo?t("noLogo"):
        state.logoSize<=20?t("logoSafe"):t("logoLarge")
    ],
    [
      t("complexity"),
      n<=29?t("healthGood"):
      n<=49?t("healthWarn"):t("healthBad"),
      n<=49?"good":"warn",
      ""
    ],
    [
      t("correction"),
      state.ecc,
      state.logo && state.ecc!=="H"?"warn":"good",
      state.logo && state.ecc!=="H"
        ? "H empfohlen / H recommended"
        : ""
    ]
  ];

  $("healthList").innerHTML=items.map(x=>`
    <div class="health-item">
      <span>${x[0]}</span>
      <span class="${x[2]}">
        <strong>${x[1]}</strong>
        ${x[3]?` · ${x[3]}`:""}
      </span>
    </div>
  `).join("");
}

/* CONTRAST */

function contrastRatio(a,b){

  const lum=c=>{
    const rgb=[
      parseInt(c.slice(1,3),16)/255,
      parseInt(c.slice(3,5),16)/255,
      parseInt(c.slice(5,7),16)/255
    ].map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));

    return .2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2];
  };

  const l1=lum(a);
  const l2=lum(b);

  return (Math.max(l1,l2)+.05)/
         (Math.min(l1,l2)+.05);
}

function createSVG(){

  const matrix=state.matrix;
  const n=matrix.length;
  const margin=state.margin;

  const total=n+margin*2;
  const cell=1000/total;

  const id="qrGradient_"+Date.now();

  let defs="";

  if(state.gradient){

    let x1="0%",y1="0%",x2="100%",y2="0%";

    if(state.gradientDirection==="vertical"){
      x1="0%";y1="0%";x2="0%";y2="100%";
    }

    if(state.gradientDirection==="diagonal"){
      x1="0%";y1="0%";x2="100%";y2="100%";
    }

    defs+=`
      <linearGradient id="${id}"
        x1="${x1}" y1="${y1}"
        x2="${x2}" y2="${y2}">
        <stop offset="0%" stop-color="${state.fg}"/>
        <stop offset="100%" stop-color="${state.gradientColor}"/>
      </linearGradient>
    `;
  }

  let body=`
    <rect width="1000" height="1000"
      fill="${state.bg}"/>
  `;

  const fill=state.gradient?`url(#${id})`:state.fg;

  for(let y=0;y<n;y++){

    for(let x=0;x<n;x++){

      if(!matrix[y][x]) continue;

      if(isFinderArea(x,y,n)) continue;

      const px=(x+margin)*cell;
      const py=(y+margin)*cell;

      const radius =
        state.style==="rounded" ? cell*.25 :
        state.style==="dot" ? cell*.48 :
        state.style==="soft" ? cell*.16 :
        0;

      body+=`
        <rect
          x="${px}"
          y="${py}"
          width="${cell}"
          height="${cell}"
          rx="${radius}"
          fill="${fill}"/>
      `;
    }
  }

  function finder(x,y){

    const px=(x+margin)*cell;
    const py=(y+margin)*cell;
    const s=7*cell;

    return `
      <rect x="${px}" y="${py}"
        width="${s}" height="${s}"
        fill="${state.fg}"/>

      <rect x="${px+cell}" y="${py+cell}"
        width="${5*cell}" height="${5*cell}"
        fill="${state.bg}"/>

      <rect x="${px+2*cell}" y="${py+2*cell}"
        width="${3*cell}" height="${3*cell}"
        fill="${fill}"/>
    `;
  }

  body+=finder(0,0);
  body+=finder(n-7,0);
  body+=finder(0,n-7);

  if(state.logo){

    const logoSize=1000*(state.logoSize/100);

    let cx=500;
    let cy=500;

    if(state.logoPosition==="bottomLeft"){
      cx=logoSize*.72;
      cy=1000-logoSize*.72;
    }

    if(state.logoPosition==="bottomRight"){
      cx=1000-logoSize*.72;
      cy=1000-logoSize*.72;
    }

    const safe=logoSize*1.24;

    const clipId="logoClip_"+Date.now();

    defs+=`
      <clipPath id="${clipId}">
        ${
          state.logoShape==="round"
          ? `<circle cx="${cx}" cy="${cy}" r="${logoSize/2}"/>`
          : `<rect x="${cx-logoSize/2}"
                   y="${cy-logoSize/2}"
                   width="${logoSize}"
                   height="${logoSize}"
                   rx="${logoSize*.14}"/>`
        }
      </clipPath>
    `;

    if(state.logoWhite){

      body+=
        state.logoShape==="round"
        ? `<circle cx="${cx}" cy="${cy}" r="${safe/2}" fill="${state.bg}"/>`
        : `<rect x="${cx-safe/2}" y="${cy-safe/2}"
                 width="${safe}" height="${safe}"
                 rx="${safe*.14}" fill="${state.bg}"/>`;
    }

    body+=`
      <image
        href="${state.logo.data}"
        x="${cx-logoSize/2}"
        y="${cy-logoSize/2}"
        width="${logoSize}"
        height="${logoSize}"
        preserveAspectRatio="xMidYMid meet"
        clip-path="url(#${clipId})"/>
    `;
  }

  return `
    <svg xmlns="http://www.w3.org/2000/svg"
      xmlns:xlink="http://www.w3.org/1999/xlink"
      viewBox="0 0 1000 1000"
      width="1000"
      height="1000">
      <defs>${defs}</defs>
      ${body}
    </svg>
  `;
}

/* INIT */

applyLanguage();
renderContent();
</script>

</body>
</html>
